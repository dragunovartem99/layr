<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				width: 440px;
				height: 280px;
				overflow: hidden;
				position: relative;
				background: #16181a;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
				color: #e2e4e3;
			}
			body::before {
				content: "";
				position: absolute;
				inset: 0;
				background:
					radial-gradient(
						420px 300px at 18% 12%,
						rgba(129, 162, 190, 0.26),
						transparent 62%
					),
					radial-gradient(
						360px 260px at 95% 95%,
						rgba(129, 162, 190, 0.12),
						transparent 62%
					);
			}
			.grid {
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
				background-size: 28px 28px;
				mask-image: radial-gradient(75% 75% at 30% 40%, #000, transparent);
			}
			.content {
				position: relative;
				padding: 28px 26px;
				height: 100%;
				display: flex;
				flex-direction: column;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 11px;
				margin-bottom: 16px;
			}
			.brand img {
				width: 36px;
				height: 36px;
				border-radius: 8px;
			}
			.brand span {
				font-size: 29px;
				font-weight: 650;
				letter-spacing: -0.02em;
			}
			h2 {
				font-size: 21px;
				line-height: 1.28;
				font-weight: 620;
				letter-spacing: -0.02em;
				margin-bottom: 9px;
			}
			h2 em {
				font-style: normal;
				color: #81a2be;
			}
			p {
				max-width: 192px;
				font-size: 13.5px;
				line-height: 1.45;
				color: #9aa0a6;
			}

			.rows {
				position: absolute;
				right: 16px;
				bottom: 18px;
				width: 196px;
				background: #1d1f21;
				border: 1px solid #373b41;
				border-radius: 9px;
				overflow: hidden;
				box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.7);
				font-size: 11.5px;
				line-height: 1.5;
			}
			.row {
				display: flex;
				align-items: baseline;
				gap: 7px;
				padding: 5px 9px;
				border-bottom: 1px solid #282a2e;
			}
			.row:last-child {
				border-bottom: 0;
			}
			.n {
				color: #969896;
				font-size: 0.85em;
				min-width: 1.1em;
				text-align: right;
			}
			.e {
				flex: 1;
				color: #81a2be;
			}
			.t {
				color: #969896;
				font-size: 0.85em;
			}
		</style>
	</head>
	<body>
		<div class="grid"></div>
		<div class="content">
			<div class="brand">
				<img
					src="../public/icons/128.png"
					alt=""
				/><span>Layr</span>
			</div>
			<h2>Every <em>dataLayer</em> push,<br />right next to the page.</h2>
			<p>Live GTM &amp; GA4 event inspector in the Chrome side panel.</p>
		</div>
		<div class="rows">
			<div class="row">
				<span class="n">5</span><span class="e">view_item</span
				><span class="t">14:22:07</span>
			</div>
			<div class="row">
				<span class="n">6</span><span class="e">add_to_cart</span
				><span class="t">14:22:31</span>
			</div>
			<div class="row">
				<span class="n">7</span><span class="e">begin_checkout</span
				><span class="t">14:23:02</span>
			</div>
			<div class="row">
				<span class="n">8</span><span class="e">purchase</span
				><span class="t">14:23:48</span>
			</div>
		</div>
	</body>
</html>
